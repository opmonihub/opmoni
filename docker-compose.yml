name: opmoni

# backend e queue são a mesma imagem (--target dev); muda só o entrypoint.
x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile
    target: dev
  env_file:
    - path: ./backend/.env
      required: false
  environment:
    APP_ENV: local
    APP_DEBUG: "true"
    # Mesma origem do navegador: nginx (:3000) serve a UI e a API.
    APP_URL: http://localhost:3000
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: opmoni
    DB_USERNAME: opmoni
    DB_PASSWORD: opmoni
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env da raiz}
    NATS_URL: nats://nats:4222
  volumes:
    - ./backend:/var/www/html
    - backend_vendor:/var/www/html/vendor
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    nats:
      condition: service_healthy
  # FPM respondendo em /ping = entrypoint terminou (vendor, .env, APP_KEY,
  # migrations) e o pool está no ar. O `queue` espera por aqui.
  healthcheck:
    test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 2>/dev/null | grep -q pong"]
    interval: 10s
    timeout: 5s
    retries: 5
    # Fresh clone: composer + migrate acontecem antes do FPM subir.
    start_period: 300s
  restart: unless-stopped
  networks:
    - opmoni

services:
  backend:
    <<: *backend

  # `php artisan queue:work` fora do container do FPM. Não roda o entrypoint do
  # backend (não reinstala vendor nem repete migrations — o depends_on abaixo
  # garante que o backend já terminou isso). O `<<` substitui a chave inteira,
  # então os serviços de dados são repetidos aqui.
  queue:
    <<: *backend
    entrypoint: ["queue-entrypoint.sh"]
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    # Worker não expõe endpoint: o probe de /ping é do FPM, não do artisan.
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      # Align Node Intl/Date with product calendar (Brazil); avoids SSR UTC vs client day skew.
      TZ: America/Sao_Paulo
      NUXT_PUBLIC_SITE_URL: http://localhost:3000
      # Browser e SSR na mesma origem, atrás do nginx — sem CORS.
      NUXT_PUBLIC_API_URL: http://localhost:3000
      NUXT_API_URL: http://nginx
      NUXT_TELEMETRY_DISABLED: 1
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_nuxt:/app/.nuxt
      - frontend_output:/app/.output
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s
    restart: unless-stopped
    networks:
      - opmoni

  # Única porta web do host: http://localhost:3000. Divide os prefixos da API
  # (FastCGI) do resto (Nuxt) — ver docker/nginx/dev.conf.
  nginx:
    image: nginx:1.28-alpine
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
    # Só o backend: o SSR do Nuxt chama a API por http://nginx, então esperar o
    # frontend aqui viraria deadlock (e o resolver resolve `frontend` por
    # requisição — o container não precisa existir para o nginx subir).
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - opmoni

  # Portas locais abaixo são só para ferramenta de desenvolvimento (psql, redis-cli,
  # nats CLI no host). O nginx é a única entrada web.
  #
  # Todas ligadas a 127.0.0.1: publicadas em 0.0.0.0, o Redis sem senha deste
  # compose foi reconfigurado como réplica de um servidor remoto por um IP da
  # internet (ataque "rogue master"). O Docker publica por cima do firewall do
  # host, então só o bind protege.
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: opmoni
      POSTGRES_USER: opmoni
      POSTGRES_PASSWORD: opmoni
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opmoni -d opmoni"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - opmoni

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env da raiz}"]
    environment:
      # O redis-cli lê a senha daqui, e ela não aparece na linha de comando do probe.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env da raiz}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - opmoni

  nats:
    image: nats:2.11-alpine
    command: ["nats-server", "--jetstream", "--http_port", "8222", "--store_dir", "/data"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - opmoni

networks:
  opmoni:
    driver: bridge

volumes:
  backend_vendor:
  frontend_node_modules:
  frontend_nuxt:
  frontend_output:
  postgres_data:
  redis_data:
  nats_data:
