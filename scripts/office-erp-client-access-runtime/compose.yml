name: opmoni-office-erp-client-access

x-backend: &backend
  image: opmoni-backend:dev
  pull_policy: never
  init: true
  user: "${OPMONI_TASK_UID}:${OPMONI_TASK_GID}"
  entrypoint: []
  working_dir: /workspace/backend
  env_file:
    - ${OPMONI_TASK_WORKTREE}/backend/.env
  environment: &backend-environment
    APP_ENV: local
    APP_DEBUG: "false"
    APP_URL: http://localhost:18870
    FRONTEND_ORIGIN: http://localhost:3350
    FRONTEND_INGRESS_KEY: ${FRONTEND_INGRESS_KEY:?Configure the existing root .env}
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: opmoni_test
    DB_USERNAME: opmoni
    DB_PASSWORD: opmoni
    DB_URL: ""
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    SESSION_CONNECTION: sessions
    SESSION_STORE: sessions
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: "null"
    REDIS_URL: ""
    REDIS_DB: 13
    REDIS_CACHE_DB: 14
    REDIS_SESSION_DB: 15
    REDIS_PREFIX: opmoni-office-erp-client-access-
    CACHE_PREFIX: opmoni-office-erp-client-access-cache-
    REDIS_CACHE_LOCK_CONNECTION: cache
    QUEUE_CONNECTION: redis
    MAIL_MAILER: array
    WHATSAPP_DISPATCH_ENABLED: "false"
    ERP_FISCAL_PROVIDER: fake
    ERP_FISCAL_PRODUCTION_ENABLED: "false"
  volumes:
    - ${OPMONI_TASK_WORKTREE}:/workspace
  networks: [task]

services:
  postgres:
    image: postgres:18-alpine
    pull_policy: never
    environment:
      POSTGRES_DB: opmoni_test
      POSTGRES_USER: opmoni
      POSTGRES_PASSWORD: opmoni
    ports: ["127.0.0.1:15470:5432"]
    volumes: ["postgres:/var/lib/postgresql"]
    networks: [task]
    healthcheck:
      test: [CMD, pg_isready, -U, opmoni, -d, opmoni_test]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8-alpine
    pull_policy: never
    command: [redis-server, --appendonly, "yes"]
    ports: ["127.0.0.1:16370:6379"]
    volumes: ["redis:/data"]
    networks: [task]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 20
  backend:
    <<: *backend
    command: [php, artisan, serve, --host=0.0.0.0, --port=8000, --no-reload]
    ports: ["127.0.0.1:18870:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  browser-backend:
    <<: *backend
    profiles: [browser]
    command: [php, artisan, serve, --host=0.0.0.0, --port=8000, --no-reload]
    environment:
      <<: *backend-environment
      APP_URL: http://localhost:18871
      FRONTEND_ORIGIN: http://localhost:3350
      DB_DATABASE: opmoni_client_access_browser
      REDIS_DB: 10
      REDIS_CACHE_DB: 11
      REDIS_SESSION_DB: 12
      REDIS_PREFIX: opmoni-office-erp-client-access-browser-
      CACHE_PREFIX: opmoni-office-erp-client-access-browser-cache-
      QUEUE_CONNECTION: redis
    ports: ["127.0.0.1:18871:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
networks:
  task:
    name: opmoni-office-erp-client-access-net
volumes:
  postgres: {name: opmoni-office-erp-client-access-postgres}
  redis: {name: opmoni-office-erp-client-access-redis}
