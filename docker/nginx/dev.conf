# nginx de entrada — desenvolvimento (docker-compose.yml).
# Única porta publicada no host: 3000. O navegador fala só com
# http://localhost:3000; UI e API saem da mesma origem ( Sanctum por cookie).
#
#   /api/* exceto /api/_nuxt_icon/*, /sanctum/*, /up -> Laravel via PHP-FPM (backend:9000)
#   /api/_nuxt_icon/* e todo o resto -> Nuxt (frontend:3000)
#
# Nada é servido do disco: o Laravel responde só por API, então o único arquivo
# enviado ao FastCGI é o front controller (public/index.php).

# Docker's embedded DNS + TTL curto: se o container `backend`/`frontend` for
# recriado (IP novo), o nginx passa a resolver sozinho em vez de 502 até
# alguém reiniciar o nginx.
resolver 127.0.0.11 ipv6=off valid=10s;

# HMR do Nuxt (WebSocket): repassa Upgrade só quando o cliente realmente pediu.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;

    # StoreClientCertificateRequest aceita no máximo 2 MiB de PFX/P12 e o PHP
    # está em 4M (docker/php/development.ini): o nginx só recusa acima de 6m,
    # para o upload grande demais chegar ao Laravel e virar 422, não 413.
    client_max_body_size 6m;

    # No proxy_pass com variável o esquema é obrigatório (o fastcgi_pass aceita
    # só host:port). Resolvidos por requisição, então IP novo do container não
    # exige restart do nginx.
    set $laravel backend:9000;
    set $nuxt http://frontend:3000;

    location ^~ /api/_nuxt_icon/ {
        proxy_pass $nuxt;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 60s;
    }

    location ~ ^/(?:api/|sanctum/|up$) {
        include fastcgi_params;
        fastcgi_pass $laravel;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        # Sobrescreve os X-Forwarded-* que o cliente mandou. O Laravel confia em
        # todos os proxies (trustProxies(at: '*') em bootstrap/app.php), então
        # sem isto o X-Forwarded-For do próprio request vira o IP do cliente e
        # o rate limiter (login/register/cnpj-lookup) passa a contar por header
        # — trocar o valor a cada request burlaria o throttle. O par real é
        # $remote_addr; o resto é o peer http://localhost:3000, o que o Nuxt já
        # espera. Em prod quem repassa isso é o Traefik (ver prod.conf).
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST  $http_host;
        fastcgi_param HTTP_X_FORWARDED_PORT  $server_port;
        fastcgi_param HTTP_X_FORWARDED_FOR   $remote_addr;
    }

    location / {
        proxy_pass $nuxt;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 60s;
    }
}
