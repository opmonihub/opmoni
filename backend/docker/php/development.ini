; Ambiente de desenvolvimento (docker-compose + docker/nginx/dev.conf).
; O código vem do bind mount ./backend e muda a cada tecla — OPcache desligado
; para nunca servir bytecode de uma versão anterior do arquivo.

; ---------------------------------------------------------------------------
; OPcache
; ---------------------------------------------------------------------------
opcache.enable = 0

; ---------------------------------------------------------------------------
; Upload
; ---------------------------------------------------------------------------
; StoreClientCertificateRequest aceita no máximo 2 MiB de PFX/P12. 4M absorve o
; envelope multipart e deixa a regra de 2 MiB gerar o 422 em vez de
; "required" por upload descartado. O nginx recusa antes, em 6m (ver dev.conf).
upload_max_filesize = 4M
post_max_size = 8M
max_file_uploads = 20

; ---------------------------------------------------------------------------
; Execução
; ---------------------------------------------------------------------------
memory_limit = 256M
max_execution_time = 60
