; Ambiente de produção (imagem --target prod + docker/nginx/prod.conf).
; O código vem assado na imagem e não muda no container: OPcache ligado sem
; revalidação por timestamp (nada de syscall de stat por request) e com buffer
; de memória dimensionado para o conjunto de arquivos do app.

; ---------------------------------------------------------------------------
; OPcache
; ---------------------------------------------------------------------------
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.max_wasted_percentage = 5
opcache.validate_timestamps = 0
opcache.save_comments = 1

; ---------------------------------------------------------------------------
; Upload
; ---------------------------------------------------------------------------
; StoreClientCertificateRequest aceita no máximo 2 MiB de PFX/P12. 4M absorve o
; envelope multipart e deixa a regra de 2 MiB gerar o 422 em vez de
; "required" por upload descartado. O nginx recusa antes, em 6m (ver prod.conf).
upload_max_filesize = 4M
post_max_size = 8M
max_file_uploads = 20

; ---------------------------------------------------------------------------
; Execução
; ---------------------------------------------------------------------------
memory_limit = 256M
max_execution_time = 60
