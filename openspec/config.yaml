# Configuration reference: https://openspec.dev/docs/configuration/config-yaml
schema: spec-driven

context: |
  Opmoni serves Brazilian accounting offices. An Account represents an office;
  Users are global identities, memberships define Account roles, and Super Admin
  is a separate platform role with no implicit access to tenant data.

  The Nuxt frontend lives in frontend/ and the Laravel application backend in
  backend/. Browser and SSR requests use /api/v1/* through the private Nuxt proxy;
  Laravel owns authentication, authorization, sessions, and application data.
  PostgreSQL and Redis support persistence and session infrastructure.
  Clients, Fiscal, Monitoring/SERPRO, Work, Team, WhatsApp, business Settings,
  and platform administration are integrated under the accepted D009 scope.
  Fiscal capture currently runs inside Laravel with private certificate/XML
  storage and queued/scheduled operations. services/fiscal/ remains the planned
  separate PHP/NFePHP extraction under D001/D002; it is not implemented.
  Home/inbox and remaining template settings retain demonstration behavior.

  Read README.md for setup and verification, docs/architecture/product-decisions.md
  for accepted and superseded decisions, and openspec/specs/ for canonical contracts.
  Read docs/architecture/fiscal-service.md when a change affects fiscal integration.
  Read docs/architecture/system-spec-reconciliation.md for the complete capability,
  route/page map, delivered platform differences, and verification limits.
  Distinguish the implemented baseline, accepted scope, and pending proposals;
  legacy code and sample screens are references, not approval to expand scope.
  The earlier add-super-admin-platform deltas are pending targets and require
  reconciliation before sync/archive; foreign support elevation is superseded by
  D009. Tenant writes require an active subscription and creation limits apply
  to clients/members. Platform lists retain their existing response envelopes.

  Preserve Account isolation, existing identities, and access/session contracts.
  Keep secrets out of Git, logs, and public runtime configuration. Fiscal certificates
  and XML belong in persistent volumes, with certificates and their passwords encrypted.
  Communicate with the user in Brazilian Portuguese; write code and artifacts in English.

rules:
  proposal:
    - State the scope, non-goals, affected capabilities, and unresolved product decisions.
    - Check current canonical specs before classifying capabilities as new or modified.
    - Identify any accepted decision the proposal would supersede; keep pending scope explicit.
  specs:
    - Include relevant authorization, Account isolation, validation, and service-failure scenarios.
    - Describe observable behavior and preserve existing access contracts unless explicitly changed.
  design:
    - Define affected frontend, Laravel, and fiscal service boundaries, including API contracts.
    - Address relevant authorization, secret handling, failure recovery, migrations, and concurrency risks.
  tasks:
    - Order small, verifiable tasks by dependency and identify the affected application or service.
    - Include checks appropriate to the change using the commands documented in README.md.
    - Require independent PostgreSQL/Redis processes when verifying database or session concurrency.

operations:
  apply:
    guidance:
      - Preserve unrelated work and follow the selected change's current artifacts and accepted decisions.
      - Run relevant checks before marking tasks complete; report failures and unverified behavior accurately.
      - Use isolated test databases and Redis stores as documented in README.md; preserve development data.
  archive:
    guidance:
      - Check task completion and verification evidence, and reconcile delta specs with canonical specs.
      - Update affected documentation links and summarize delivered scope and remaining limitations.
